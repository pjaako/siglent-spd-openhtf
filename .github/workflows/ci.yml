name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff check
        run: ruff check src tests example_test.py tools
      - name: Ruff format
        run: ruff format --check src tests example_test.py tools
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q
      - name: Example with the fake supply
        run: python example_test.py --fake
